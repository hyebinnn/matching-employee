# 매칭/점수 정책 설정 — 모든 값은 임시값이며 캘리브레이션 대상이다.

embedding:
  # 임계값은 모델마다 유사도 분포가 달라 모델과 함께 관리한다. 모델을 바꾸면 임계값도 다시 잡아야 한다.
  model: text-embedding-3-small

# 코사인 유사도 기준 판정 (similarity >= met → met, >= partial → partial, 그 외 unmet)
# 목업 이력서 12명의 라벨로 조합을 비교해 고른 값 (uv run python -m tools.evaluate --sweep)
# LLM 재판정을 껐을 때의 순위 역전을 기준으로 삼았다. LLM을 켜도 met 0.75에서는 역전이 1회 남고,
# LLM이 없거나 실패했을 때의 품질도 이 값에 달려 있다.
thresholds:
  met: 0.7
  partial: 0.3

# 조건 유형별 가중치 (상대 비율만 의미 있음)
weights:
  required: 2.0
  preferred: 1.0

# 판정 결과별 가중치 반영 비율
status_credit:
  met: 1.0
  partial: 0.5
  unmet: 0.0

# min_years 조건: years >= min_years → met, years >= min_years * partial_ratio → partial
years:
  partial_ratio: 0.7

# 필수 조건 충족률(필수 조건을 met=1/partial=0.5로 세어 필수 조건 수로 나눈 값)에 따른 점수 상한.
# 조건 개수가 다른 공고를 같은 잣대로 보기 위해 개수가 아니라 비율로 판단한다.
# 여러 단계에 해당되면 가장 낮은 상한을 적용한다.
# 한계(모든 필수 조건을 같은 무게로 본다)와 확장 방향은 README에 적어 뒀다.
required_cap:
  enabled: true
  tiers:
    - below_ratio: 0.5
      cap: 40
    - below_ratio: 0.8
      cap: 70

# LLM 재판정. 임베딩 유사도가 low~high 사이인 조건을 이력서 전문과 함께 LLM에 다시 묻는다.
# 점수는 여전히 코드가 계산한다. LLM은 met/partial/unmet 판정과 근거 문장만 돌려준다.
# low=0: 충족으로 확정되지 않은 조건은 전부 재판정한다. 하한을 두면 그 경계 바로 아래의 실제 충족
#        사례가 미충족으로 남는다 (실측 사례는 README 참고).
# high: thresholds.met과 같게 둔다 (충족으로 확정된 조건은 다시 묻지 않는다).
# 호출은 지원자 1명당 1회로 묶이므로 조건이 늘어도 호출 수는 늘지 않는다.
llm_judge:
  enabled: true
  model: gpt-5.4-mini
  band:
    low: 0.0
    high: 0.7
  # LLM이 인용한 근거 문장이 이력서 원문에 실제로 있는지 확인하는 기준
  evidence_min_similarity: 0.8
