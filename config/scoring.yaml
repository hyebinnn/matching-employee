# 매칭/점수 정책 설정 — 모든 값은 임시값이며 캘리브레이션 대상이다.

embedding:
  # 임계값은 모델마다 유사도 분포가 달라 모델과 함께 관리한다. 모델을 바꾸면 임계값도 다시 잡아야 한다.
  model: text-embedding-3-small

# 코사인 유사도 기준 판정 (similarity >= met → met, >= partial → partial, 그 외 unmet)
thresholds:
  met: 0.75
  partial: 0.55

# 조건 유형별 가중치 (상대 비율만 의미 있음)
weights:
  required: 2.0
  preferred: 1.0

# 판정 결과별 가중치 반영 비율
status_credit:
  met: 1.0
  partial: 0.5
  unmet: 0.0

# min_years 조건: years >= min_years → met, years >= min_years * partial_ratio → partial
years:
  partial_ratio: 0.7

# 필수 조건 미충족 시 점수 상한. 여러 개가 해당되면 가장 낮은 상한을 적용한다.
required_cap:
  unmet:
    enabled: true
    cap: 40
  partial:
    enabled: true
    cap: 70
