# 매칭/점수 정책 설정 — 모든 값은 임시값이며 캘리브레이션 대상이다.

embedding:
  # 임계값은 모델마다 유사도 분포가 달라 모델과 함께 관리한다. 모델을 바꾸면 임계값도 다시 잡아야 한다.
  model: text-embedding-3-small

# 코사인 유사도 기준 판정 (similarity >= met → met, >= partial → partial, 그 외 unmet)
# 목업 이력서 12명의 라벨로 조합을 비교해 고른 값 (uv run python -m tools.evaluate --sweep)
# LLM 재판정을 껐을 때의 순위 역전을 기준으로 삼았다. LLM을 켜면 두 값 모두 역전 0회지만,
# LLM이 없거나 실패했을 때의 품질이 이 값에 달려 있다.
thresholds:
  met: 0.7
  partial: 0.3

# 조건 유형별 가중치 (상대 비율만 의미 있음)
weights:
  required: 2.0
  preferred: 1.0

# 판정 결과별 가중치 반영 비율
status_credit:
  met: 1.0
  partial: 0.5
  unmet: 0.0

# min_years 조건: years >= min_years → met, years >= min_years * partial_ratio → partial
years:
  partial_ratio: 0.7

# 필수 조건 충족률(필수 가중치 중 met=100%/partial=50%로 채운 비율)에 따른 점수 상한.
# 조건 개수가 다른 공고를 같은 잣대로 보기 위해 개수가 아니라 비율로 판단한다.
# 여러 단계에 해당되면 가장 낮은 상한을 적용한다.
#
# 한계: 모든 필수 조건을 같은 무게로 본다. 실제로는 양보 가능한 필수 조건과 그렇지 않은 조건이 있다
# (예: '일본어 커뮤니케이션' vs '디자인 관련 전공'). 조건별 중요도는 공고 원문만으로 알 수 없어,
# 고객사가 조건별 중요도를 함께 넘겨주는 구조를 전제로 확장할 지점이다.
required_cap:
  enabled: true
  tiers:
    - below_ratio: 0.5
      cap: 40
    - below_ratio: 0.8
      cap: 70

# LLM 재판정. 임베딩 유사도가 low~high 사이인 조건을 이력서 전문과 함께 LLM에 다시 묻는다.
# (임베딩은 "화장품 단상자 그래픽 설계" ↔ "패키지 디자인" 같은 업계 표현 차이를 넘지 못한다)
# 점수는 여전히 코드가 계산한다. LLM은 met/partial/unmet 판정과 근거 문장만 돌려준다.
#
# low=0: 임베딩이 충족으로 보지 않은 조건은 전부 재판정한다. 하한을 두면 그 경계 바로 아래의
# 실제 충족 사례가 걸러지지 않은 채 "미충족"으로 표시되어 결과 신뢰도가 떨어진다.
# (실측: 하한 0.3에서 "생산팀, 품질팀과 논의하며 사양을 확정" ↔ "유관 부서와 원활한 커뮤니케이션"이
#  유사도 0.28로 미충족 처리됨. 하한을 없애면 이런 2건이 바로잡히고 미스매칭 지원자 점수는 그대로였다)
# 호출은 지원자 1명당 1회로 묶이므로 조건이 늘어도 호출 수는 늘지 않는다.
# high는 thresholds.met과 같게 둔다 (충족으로 확정된 조건은 다시 묻지 않는다).
llm_judge:
  enabled: true
  model: gpt-5.4-mini
  band:
    low: 0.0
    high: 0.7
  # LLM이 인용한 근거 문장이 이력서 원문에 실제로 있는지 확인하는 기준
  evidence_min_similarity: 0.8
