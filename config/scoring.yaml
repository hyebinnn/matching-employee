# 매칭/점수 정책 설정 — 모든 값은 임시값이며 캘리브레이션 대상이다.

embedding:
  # 임계값은 모델마다 유사도 분포가 달라 모델과 함께 관리한다. 모델을 바꾸면 임계값도 다시 잡아야 한다.
  model: text-embedding-3-small

# 코사인 유사도 기준 판정 (similarity >= met → met, >= partial → partial, 그 외 unmet)
# 목업 이력서 12명의 유사도 분포로 조정한 값 (미스매칭 0.20~0.37, 완벽 매칭 0.28~0.96)
thresholds:
  met: 0.65
  partial: 0.35

# 조건 유형별 가중치 (상대 비율만 의미 있음)
weights:
  required: 2.0
  preferred: 1.0

# 판정 결과별 가중치 반영 비율
status_credit:
  met: 1.0
  partial: 0.5
  unmet: 0.0

# min_years 조건: years >= min_years → met, years >= min_years * partial_ratio → partial
years:
  partial_ratio: 0.7

# 필수 조건 충족률(필수 가중치 중 met=100%/partial=50%로 채운 비율)에 따른 점수 상한.
# 조건 개수가 다른 공고를 같은 잣대로 보기 위해 개수가 아니라 비율로 판단한다.
# 여러 단계에 해당되면 가장 낮은 상한을 적용한다.
#
# 한계: 모든 필수 조건을 같은 무게로 본다. 실제로는 양보 가능한 필수 조건과 그렇지 않은 조건이 있다
# (예: '일본어 커뮤니케이션' vs '디자인 관련 전공'). 조건별 중요도는 공고 원문만으로 알 수 없어,
# 고객사가 조건별 중요도를 함께 넘겨주는 구조를 전제로 확장할 지점이다.
required_cap:
  enabled: true
  tiers:
    - below_ratio: 0.5
      cap: 40
    - below_ratio: 0.8
      cap: 70
