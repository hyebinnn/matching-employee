# 공고 이미지 파싱 설정 — 모든 값은 임시값이다.

vision:
  # 실제 파싱 전에 결정한다. 비어 있으면 CLI가 실행을 거부한다.
  model: gpt-5.4-mini

# 세로로 긴 공고 이미지를 조각낸다. 조각 경계에 걸린 줄이 잘리지 않도록 겹쳐서 자른다.
tiling:
  max_height: 1600
  overlap: 120

ocr:
  lang: kor+eng
  # 작은 글씨 인식률을 높이기 위한 확대 배율 (1.0 = 확대 안 함)
  upscale: 1.0
  # Tesseract page segmentation mode (6 = 한 덩어리 텍스트로 간주, 3 = 자동 레이아웃 분석)
  # 합성 이미지 비교에서 3은 줄을 누락함. 실제 공고 이미지로 다시 비교해 정한다.
  psm: 6

# LLM이 뽑은 조건 문장이 OCR 원문에 있는지 판단하는 기준 (정규화 후 부분 문자열 유사도)
verify:
  min_similarity: 0.8
